# File: docker-compose.yml (Development with Frontend)
services:
  # PostgreSQL Permission Init Container - runs BEFORE postgres
  postgres-permissions:
    image: alpine:latest
    container_name: saatvik-el-postgres-init
    command: |
      sh -c "
        echo 'Setting up PostgreSQL data directory permissions...'
        mkdir -p /var/lib/postgresql/data
        chown -R 70:70 /var/lib/postgresql/data
        chmod -R 700 /var/lib/postgresql/data
        echo 'PostgreSQL permissions configured successfully'
      "
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: "no" # Only run once

  # Frontend build service - runs first to build React app
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
    container_name: saatvik-el-frontend-build
    volumes:
      # Output React build to FastAPI static directory
      - ./app/static:/app/dist:rw
    environment:
      - NODE_ENV=production

  # PostgreSQL database
  postgres:
    image: postgres:15.0-alpine
    container_name: saatvik-el-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saatvik_el_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Ensure postgres user has proper permissions
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=peer"
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    depends_on:
      postgres-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend service
  fastapi-app:
    build: .
    container_name: saatvik-el-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/saatvik_el_db
      EL_FOLDER_PATH: "mnt/shared"
      CONFIDENCE_THRESHOLD: 0.2
    volumes:
      # Application data
      - ./source:/app/source:rw
      - ./processed:/app/processed:rw
      - ./backup:/app/backup:rw
      - ./logs:/app/logs:rw
      - ./watchdog:/app/watchdog:rw
      # Mount SMB share (mounted on host)
      - /mnt/shared:/mnt/shared:ro
      # Application code
      - ./app:/app/app:ro
      - ./models:/app/models:ro
      # Static files from frontend build
      - ./app/static:/app/app/static:ro
      - ./shared_config.json:/app/shared_config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
