# File: docker-compose.staging.yml
services:
  # Frontend build service for staging
  frontend-build-stage:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
    container_name: saatvik-el-frontend-build-stage
    volumes:
      # Output React build to staging static directory
      - ./app/static:/app/dist:rw
    environment:
      - NODE_ENV=production

  # FastAPI backend service for staging
  fastapi-app-stage:
    build:
      context: .
      args:
        ENV: staging
        DEBUG: false
    container_name: saatvik-el-api-stage
    restart: unless-stopped
    ports:
      - "8001:8000" # Different port for staging
    env_file:
      - .env.staging
    volumes:
      # Application data - SEPARATE folders for staging
      - ./staging/source:/app/source:rw
      - ./staging/processed:/app/processed:rw
      - ./staging/backup:/app/backup:rw
      - ./staging/logs:/app/logs:rw
      - ./watchdog:/app/watchdog:rw
      # Mount SMB share (mounted on host)
      - /mnt/shared:/mnt/shared:ro
      # Application code
      - ./app:/app/app:ro
      - ./models:/app/models:ro
      # Static files from frontend build
      - ./app/static:/app/app/static:ro
    depends_on:
      postgres-stage:
        condition: service_healthy
      frontend-build-stage:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 60s
      retries: 3

  # PostgreSQL database for staging
  postgres-stage:
    image: postgres:15.0-alpine
    container_name: saatvik-el-db-stage
    restart: unless-stopped
    environment:
      POSTGRES_DB: saatvik_el_db_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # Different port for staging DB
    volumes:
      - ./staging/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_staging:
